name: Android CI

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/repository-metadata.json"
      - ".github/labels.json"
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/repository-metadata.json"
      - ".github/labels.json"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Validate pull request
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain > gradle-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 160 gradle-output.log
          fi
          exit "$status"

      - name: Build master APK
        if: github.event_name == 'push'
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --console=plain > gradle-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 160 gradle-output.log
          fi
          exit "$status"

      - name: Upload master debug APK
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: GymTrack-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: gradle-output.log
          retention-days: 3
